[project]
name = "forge-sample"
version = "0.1.0"
description = "Small text helpers used to test an automated coding loop."
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["forge_sample", "tests"]
